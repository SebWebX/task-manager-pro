<div class="board-controls" role="toolbar" aria-label="Controles del tablero">
    <div class="board-controls__tabs">
        <button class="board-controls__tab board-controls__tab--active" aria-pressed="true">Kanban</button>
        <button class="board-controls__tab" aria-pressed="false">Tabla</button>
        <button class="board-controls__tab" aria-pressed="false">Calendario</button>
    </div>
    <div class="board-controls__spacer"></div>
    <div class="board-controls__buttons">

        <!-- Filtrar -->
        <div class="board-controls__dropdown">
            <button class="board-controls__button" 
                [class.board-controls__button--active]="hasActiveFilters"
                aria-label="Filtrar tareas" 
                (click)="toggleFilterMenu()">
                <i class="ti ti-filter" aria-hidden="true"></i> Filtrar
            </button>
            @if (showFilterMenu) {
                <div class="board-controls__menu">
                    <button class="board-controls__menu-item" (click)="filterByPriority(null)">Todas</button>
                    <button class="board-controls__menu-item" (click)="filterByPriority('alta')">Alta</button>
                    <button class="board-controls__menu-item" (click)="filterByPriority('media')">Media</button>
                    <button class="board-controls__menu-item" (click)="filterByPriority('baja')">Baja</button>
                </div>
            }
        </div>

        <!-- Ordenar -->
        <div class="board-controls__dropdown">
            <button class="board-controls__button"
                [class.board-controls__button--active]="hasActiveSort"
                aria-label="Ordenar tareas" 
                (click)="toggleSortMenu()">
                <i class="ti ti-arrows-sort" aria-hidden="true"></i> Ordenar
            </button>
            @if (showSortMenu) {
                <div class="board-controls__menu">
                    <button class="board-controls__menu-item" (click)="sortBy(null)">Sin ordenar</button>
                    <button class="board-controls__menu-item" (click)="sortBy('date')">Por fecha</button>
                    <button class="board-controls__menu-item" (click)="sortBy('priority')">Por prioridad</button>
                </div>
            }
        </div>

        <button class="board-controls__button board-controls__button--primary" aria-label="Crear nueva tarea" (click)="openModal()">
            <i class="ti ti-plus" aria-hidden="true"></i> Nueva tarea
        </button>
    </div>
</div>
