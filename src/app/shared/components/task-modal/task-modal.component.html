@if (isOpen) {
  <div class="task-modal">
    <div class="task-modal__backdrop" (click)="closeModal()"></div>
    
    <div class="task-modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="task-modal__header">
        <h2 id="modal-title" class="task-modal__title">Nueva tarea</h2>
        <button class="task-modal__close" aria-label="Cerrar modal" type="button" (click)="closeModal()">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>

      <form class="task-modal__form" [formGroup]="taskForm" (ngSubmit)="onSubmit()">
        <div class="task-modal__field">
          <label for="task-title">Título</label>
          <input formControlName="title" id="task-title" type="text" placeholder="Nombre de la tarea">
        </div>

        <div class="task-modal__field">
          <label for="task-description">Descripción</label>
          <textarea formControlName="description" id="task-description" placeholder="Descripción de la tarea"></textarea>
        </div>

        <div class="task-modal__field">
          <label for="task-priority">Prioridad</label>
          <select formControlName="priority" id="task-priority">
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>

        <div class="task-modal__field">
          <label for="task-date">Fecha</label>
          <input formControlName="date" id="task-date" type="date">
        </div>

        <div class="task-modal__field">
          <label>Etiquetas</label>
          <div class="task-modal__tags">
            @for (label of labels; track label) {
              <span class="task-modal__tag">
                {{ label }}
                <button type="button" (click)="removeLabel($index)">
                  <i class="ti ti-x" aria-hidden="true"></i>
                </button>
              </span>
            }
            <input
              type="text"
              placeholder="Escribe y presiona Enter"
              [(ngModel)]="newLabel"
              [ngModelOptions]="{standalone: true}"
              (keydown)="addLabel($event)">
          </div>
        </div>

        <div class="task-modal__field">
          <label>Asignados</label>
          <div class="task-modal__tags">
            @for (person of assigned; track person) {
              <span class="task-modal__tag">
                {{ person }}
                <button type="button" (click)="removeAssigned($index)">
                  <i class="ti ti-x" aria-hidden="true"></i>
                </button>
              </span>
            }
            <input
              type="text"
              placeholder="Iniciales y presiona Enter"
              [(ngModel)]="newAssigned"
              [ngModelOptions]="{standalone: true}"
              (keydown)="addAssigned($event)">
          </div>
        </div>

        <div class="task-modal__field">
          <label>Subtareas</label>
          <div class="task-modal__subtasks">
            @for (subtask of subtasks; track subtask.text) {
              <div class="task-modal__subtask-item" [class.task-modal__subtask-item--completed]="subtask.completed">
                <button type="button" class="task-modal__subtask-check" (click)="toggleSubtask($index)">
                  @if (subtask.completed) {
                    <i class="ti ti-circle-check" aria-hidden="true"></i>
                  } @else {
                    <i class="ti ti-circle" aria-hidden="true"></i>
                  }
                </button>
                <span>{{ subtask.text }}</span>
                <button type="button" class="task-modal__subtask-remove" (click)="removeSubtask($index)">
                  <i class="ti ti-x" aria-hidden="true"></i>
                </button>
              </div>
            }
            <input
              type="text"
              placeholder="Escribe una subtarea y presiona Enter"
              [(ngModel)]="newSubtask"
              [ngModelOptions]="{standalone: true}"
              (keydown)="addSubtask($event)">
          </div>
        </div>

        <div class="task-modal__footer">
          <button class="task-modal__cancel" type="button" (click)="closeModal()">Cancelar</button>
          <button class="task-modal__submit" type="submit">Crear tarea</button>
        </div>
      </form>
    </div>
  </div>
}
